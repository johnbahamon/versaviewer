# coturn config for VersaViewer Phase 0 (static long-term credentials).
# Phase 2 replaces --user with time-limited REST credentials (use-auth-secret)
# issued per session by the session service.
listening-port=3478
min-port=49160
max-port=49200
realm=versaviewer.local
fingerprint
lt-cred-mech
no-cli
no-tlsv1
no-tlsv1_1
# Never relay to private/loopback ranges of the TURN host itself (SSRF).
# On a LAN test where peers are on 192.168.x, comment the matching line.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
log-file=stdout
simple-log
