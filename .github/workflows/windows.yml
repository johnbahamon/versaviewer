# Windows build + tests + end-to-end smoke test on a GitHub-hosted runner.
#
# Hosted runners have no GPU: this validates compilation, unit/integration
# tests, the agent's start-up, the GPU -> CPU fallback and a full session on
# 127.0.0.1. GPU / hardware-encoder behaviour is tested on real hardware.
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM (OpenH264 SIMD assembly)
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target $env:TARGET -- -D warnings

      - name: Tests
        run: cargo test --workspace --target $env:TARGET

      - name: Build release binaries
        run: |
          cargo build --release --target $env:TARGET -p vv-agent -p vv-viewer
          cargo build --release --target $env:TARGET -p vv-engine --example headless_viewer

      - name: Signaling server (build + tests)
        working-directory: services/signaling
        run: |
          npm ci
          npm run build
          npm test

      - name: Probe video capabilities
        run: target\${{ env.TARGET }}\release\vv-agent.exe --probe

      - name: Smoke test (default pipeline)
        continue-on-error: true
        run: ./scripts/windows-smoke.ps1

      - name: Smoke test (CPU pipeline)
        continue-on-error: true
        run: ./scripts/windows-smoke.ps1 -AgentArgs --no-gpu

      - name: Upload agent
        uses: actions/upload-artifact@v4
        with:
          name: vv-agent-windows-x64
          path: target/${{ env.TARGET }}/release/vv-agent.exe

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore
