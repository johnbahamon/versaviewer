# Link the MSVC C runtime statically so vv-agent.exe runs on a clean Windows
# install without the Visual C++ Redistributable (no VCRUNTIME140.dll needed).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
